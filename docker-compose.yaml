version: "3.9"

services:
  mongodb:
    image: joindevops/mongodb:1.0.0
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb:/data/db
    networks:
      - roboshop

  redis:
    image: redis:7.0
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis:/data
    networks:
      - roboshop

  mysql:
    image: devopman/mysql:v1
    container_name: mysql
    restart: unless-stopped
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - roboshop

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    networks:
      - roboshop

  catalogue:
    image: devopman/catalogue:v1
    container_name: catalogue
    restart: unless-stopped
    depends_on:
      - mongodb
    networks:
      - roboshop

  user:
    image: devopman/user:v1
    container_name: user
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    networks:
      - roboshop

  cart:
    image: devopman/cart:v1
    container_name: cart
    restart: unless-stopped
    depends_on:
      - catalogue
      - redis
    networks:
      - roboshop

  shipping:
    image: devopman/shipping:v1
    container_name: shipping
    restart: unless-stopped
    depends_on:
      - mysql
      - cart
    networks:
      - roboshop

  payment:
    image: devopman/payment:v1
    container_name: payment
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - cart
      - user
    environment:
      CART_HOST: cart
      CART_PORT: "8080"
      USER_HOST: user
      USER_PORT: "8080"
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    networks:
      - roboshop

  frontend:
    image: devopman/frontend:v1
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
    networks:
      - roboshop

networks:
  roboshop:
    driver: bridge

volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq:
